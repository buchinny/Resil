[project]
name = "metac-bot-template"
version = "0.1.0"
description = ""
authors = [{ name = "Vasile Popescu", email = "elisescu@elisescu.com" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "requests>=2.32.3,<3",
    "numpy>=2.3.0,<3",
    "python-dotenv>=1.0.1,<2",
    "litellm>=1.105.1,<2",
    "forecasting-tools>=0.2.90,<0.4.0",
]

[dependency-groups]
integrations = [
    "metaculus-bot-review>=0.1.1,<0.2",
]
dev = [
    "ipykernel>=6.29.5,<7",
    "pytest>=9.2.0",
]

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { forecasting-tools = false }
